# Reusable JS/TS CI — the klarlabs-studio bar for Node projects.
#
# Auto-adapts to each repo: runs lint / typecheck / test / build only when
# that npm script exists (handles the typecheck vs type-check naming split),
# and a nox security scan (npm dependency CVEs + secrets, the org's single
# dependency-CVE source of truth). Cost-aware: one install, dependency cache,
# concurrency-cancel (set in the caller), docs-only paths ignored.
#
# Call it from a repo with a thin wrapper (.github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: klarlabs-studio/.github/.github/workflows/js-ci.yml@main
#       permissions:
#         contents: read
#         security-events: write
#       secrets: inherit
#       with:
#         package-manager: pnpm     # npm (default) | pnpm | yarn
#
# Bump pinned action/tool versions here once; every caller picks it up.
on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "22"
      package-manager:
        description: "npm (default) | pnpm | yarn. Drives install + cache + run."
        type: string
        default: "npm"
      working-directory:
        description: "Path to the package when it is NOT at the repo root (monorepos)."
        type: string
        default: "."
      nox-version:
        type: string
        default: "1.29.0"
      nox-sha256:
        type: string
        default: "b2c0dca2ab4dba4f94a73277f1f50e4196360a1ad87b145b2c2d9cb6e5cc8dc3"
      nox-strict:
        description: "Fail on net-new critical/high even before a baseline exists."
        type: boolean
        default: false
      run-build:
        description: "Run the build script. Set false for repos whose build needs setup the reusable doesn't do (e.g. sub-project installs in a monorepo) and is handled in the repo's own integration workflow instead."
        type: boolean
        default: true

# No workflow-level permissions block here, deliberately.
#
# In a reusable workflow this block is not a default — it is what the jobs
# request, and the caller must grant at least as much. A scope listed here that
# a caller does not grant is a startup_failure: the workflow never begins, so it
# reports no jobs and no check at all, and every PR gating on this context waits
# forever on a check that cannot arrive.
#
# `packages: read` was added here so pet-medical-www could reach the private
# @klarlabs-studio registry, on the belief that it "costs nothing for callers
# that do not use a private registry". It cost them their whole pipeline:
# klarlabs, armada, dispatch and fortify-ts each grant
# contents/security-events/pull-requests and no packages, and all four sat in
# startup_failure until this was removed. pet-medical-www, the one caller that
# granted packages, was the only one still green — which is why it read as
# working.
#
# Omitting the block entirely makes each job inherit exactly what its caller
# granted, so a caller needing the private registry adds `packages: read` to its
# own permissions and gets it, and a caller that does not need it is not forced
# to ask for a scope it has no use for.

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # No job-level permissions here: a reusable job cannot request more than
    # the caller granted (that's a startup_failure). The token inherits the
    # caller job's permissions. Repos pulling private @klarlabs-studio packages
    # from GitHub Packages add `packages: read` to their caller's permissions.
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        # Repinned 2026-08: pnpm moved the v4.1.0 tag, orphaning the previous
        # SHA. An unresolvable action reference is a startup failure — the
        # workflow never begins, so it reports no jobs and no check at all, and
        # every PR gating on this context waits forever on a check that cannot
        # arrive. Same version, current commit.
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.package-manager == 'pnpm' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || (inputs.package-manager == 'yarn' && format('{0}/yarn.lock', inputs.working-directory) || format('{0}/package-lock.json', inputs.working-directory)) }}
      - name: Install dependencies
        # NODE_AUTH_TOKEN authenticates GitHub Packages for repos whose .npmrc
        # points @klarlabs-studio at npm.pkg.github.com. Prefer a PACKAGES_READ_TOKEN
        # secret (a read:packages PAT) when present — required for CROSS-repo
        # private/internal packages, which the default GITHUB_TOKEN cannot read.
        # Falls back to GITHUB_TOKEN (fine for same-repo packages / public deps).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.PACKAGE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *)    npm ci ;;
          esac
      - name: Detect available scripts
        id: scripts
        run: |
          node -e '
            const s = (require("./package.json").scripts) || {};
            const fs = require("fs");
            const w = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
            w("lint", !!s.lint);
            w("test", !!s.test);
            w("build", !!s.build);
            const tc = s.typecheck ? "typecheck" : (s["type-check"] ? "type-check" : "");
            w("typecheck_name", tc);
          '
      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: ${{ inputs.package-manager }} run lint
      - name: Typecheck
        if: steps.scripts.outputs.typecheck_name != ''
        run: ${{ inputs.package-manager }} run ${{ steps.scripts.outputs.typecheck_name }}
      - name: Test
        if: steps.scripts.outputs.test == 'true'
        run: ${{ inputs.package-manager }} run test
      - name: Build
        if: inputs.run-build && steps.scripts.outputs.build == 'true'
        run: ${{ inputs.package-manager }} run build

  security:
    name: Security (nox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # nox annotate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install nox (pinned + sha256-verified binary)
        env:
          NOX_VERSION: ${{ inputs.nox-version }}
          NOX_SHA256: ${{ inputs.nox-sha256 }}
        # Unpack in a temp dir, NOT the checkout. The release tarball ships
        # LICENSE, README.md, bin/ and nox — so extracting here overwrote the
        # repo's own README.md and LICENSE and left bin/ behind, and the very
        # next step scanned the result. nox's README documents GitHub Actions
        # SHA pins, which are 40-hex and match eight vendor API-key regexes, so
        # every caller got 16 identical phantom "API key" findings with the same
        # fingerprints across unrelated repos. The scan was corrupting the tree
        # it was scanning.
        run: |
          tmp="$(mktemp -d)"
          curl -sL -o "$tmp/nox.tar.gz" \
            "https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          echo "${NOX_SHA256}  $tmp/nox.tar.gz" | sha256sum -c -
          tar xzf "$tmp/nox.tar.gz" -C "$tmp"
          sudo mv "$tmp/nox" /usr/local/bin/
          rm -rf "$tmp"
          nox version
      - name: Scan
        # nox core covers JS/TS dependency CVEs (OSV), secrets, and IaC. The
        # Go-only taint-analysis plugin is intentionally NOT installed here.
        run: nox scan ${{ inputs.working-directory }} -format json,sarif -output nox-results || true
      - name: Upload SARIF to code scanning
        # `-output nox-results` writes results.sarif and findings.json. The SARIF
        # was looked up as findings.sarif, so hashFiles() never matched and this
        # step has silently skipped on every run since it was added — code
        # scanning has received nothing. The JSON path below was correct, which
        # is why PR annotation worked and this did not.
        if: always() && hashFiles('nox-results/results.sarif') != ''
        # Never fail the security gate on a reporting step. Code scanning needs
        # Code Security enabled, which private repos without GHAS do not have —
        # there the upload returns "Resource not accessible by integration" even
        # with security-events: write, which is granted above. Correcting the
        # filename turned a step that had silently skipped forever into one that
        # actually runs, and on those repos that meant a red gate for a reason
        # unrelated to any finding. The gate is the net-new critical/high step
        # below; this one only publishes what the gate already decided.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: nox-results/results.sarif
      - name: Annotate PR
        if: github.event_name == 'pull_request' && hashFiles('nox-results/findings.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nox annotate -input nox-results/findings.json || true
      - name: Gate on net-new critical/high findings
        # Self-adjusting: report-only until the repo commits a nox baseline
        # (or nox-strict is set), then gates net-new critical/high. Adopting
        # the workflow never breaks a red build on day one.
        #
        # Deliberately NOT guarded by hashFiles(findings.json). A missing file
        # used to skip this step, and a skipped step is green -- so the gate
        # quietly ceased to exist for any repo where nox wrote no JSON. That is
        # live today: a repo-level .nox.yaml with `output.format: sarif`
        # overrides the `-format json,sarif` above, and nexa (20 findings) and
        # lexora (63) have been passing this job without it ever running.
        # Absence is now handled in-script and is fatal wherever the repo has
        # committed a baseline.
        if: always()
        env:
          NOX_STRICT: ${{ inputs.nox-strict }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          f=nox-results/findings.json
          if [ ! -f "$f" ]; then
            if [ -f "${WORKDIR}/.nox/baseline.json" ] || [ "$NOX_STRICT" = "true" ]; then
              echo "::error::nox wrote no findings.json, so the security gate evaluated nothing. Most likely .nox.yaml sets output.format, which overrides this workflow's '-format json,sarif' -- drop that key, or include json in it."
              exit 1
            fi
            echo "::warning::nox wrote no findings.json, so the security gate evaluated nothing. Report-only (no committed baseline), so not failing the build."
            exit 0
          fi
          baselined=$(jq '[.findings[]? | select(.Status=="baselined")] | length' "$f" 2>/dev/null || echo 0)
          new=$(jq '[.findings[]? | select((.Severity=="critical" or .Severity=="high") and (.Status!="baselined"))] | length' "$f" 2>/dev/null || echo 0)
          echo "net-new critical/high: $new (baselined findings: $baselined)"
          if [ "$baselined" -eq 0 ] && [ "$NOX_STRICT" != "true" ]; then
            echo "::notice::No nox baseline established — security gate is report-only. Run 'nox baseline add' and commit .nox/ to enforce net-new critical/high."
            exit 0
          fi
          if [ "$new" -gt 0 ]; then
            echo "::error::Net-new critical/high findings. Run 'nox baseline add' or remediate."
            jq '.findings[] | select((.Severity=="critical" or .Severity=="high") and (.Status!="baselined")) | {severity:.Severity, rule:.RuleID, file:.Location.FilePath, line:.Location.StartLine}' "$f"
            exit 1
          fi
      - name: Upload nox artifacts
        if: always() && hashFiles('nox-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nox-results
          path: nox-results/
          retention-days: 7
