name: Test Go CI contract interface
on:
  pull_request:
    paths:
      - '.github/workflows/go-ci.yml'
      - '.github/workflows/test-go-contract.yml'
      - 'scripts/test_go_ci_contract.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/go-ci.yml'
      - '.github/workflows/test-go-contract.yml'
      - 'scripts/test_go_ci_contract.py'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
