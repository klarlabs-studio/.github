# Reusable Nox Remediate — dependency + GitHub Actions remediation in one place.
#
# Replaces dependabot org-wide. nox scans for OSV-vulnerable dependencies AND
# outdated / mutable GitHub Actions pins, applies the fixes, and opens a single
# PR; the org-wide auto-merge lands it once CI is green.
#
# Call it from a repo with a thin wrapper (see nox-remediate-caller-example.yml):
#
#   on:
#     schedule:
#       - cron: "17 6 * * 1"
#     workflow_dispatch: {}
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     remediate:
#       uses: klarlabs-studio/.github/.github/workflows/nox-remediate.yml@main
#       secrets: inherit
#
# Bump nox-version / nox-sha256 here once; every caller picks it up.
on:
  workflow_call:
    inputs:
      nox-version:
        description: "nox release version (no leading v)."
        type: string
        default: "1.26.0"
      nox-sha256:
        description: "sha256 of nox_<version>_linux_amd64.tar.gz (verify on bump)."
        type: string
        default: "6879f8c7b523ebab9920d40919917b422bb952f9252fbadde9061cb37827793c"
      include-major:
        description: "Allow major-version action bumps (off by default; majors are surfaced but held)."
        type: boolean
        default: false
    secrets:
      NOX_TOKEN:
        description: "PAT with contents+pull-requests+workflows write. Required to push remediation of .github/workflows/* (the default GITHUB_TOKEN can't). Falls back to GITHUB_TOKEN for dependency-only remediation."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nox-remediate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # The default GITHUB_TOKEN cannot push changes to .github/workflows/*
          # (GitHub blocks it without the `workflows` scope), and remediating
          # action pins edits workflow files. NOX_TOKEN (org secret, flows in
          # via `secrets: inherit`) is a PAT with that scope; falls back to
          # GITHUB_TOKEN (fine for dependency-only remediation).
          token: ${{ secrets.NOX_TOKEN || github.token }}
          persist-credentials: true

      # Toolchains for the dependency-tidy step (only used when a manifest is
      # present). Go via the repo's go.mod; node fixed at 22.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install nox (pinned + sha256-verified)
        env:
          NOX_VERSION: ${{ inputs.nox-version }}
          NOX_SHA256: ${{ inputs.nox-sha256 }}
        run: |
          url="https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o nox.tgz
          echo "${NOX_SHA256}  nox.tgz" | sha256sum -c -
          sudo tar xzf nox.tgz -C /usr/local/bin nox
          rm nox.tgz

      - name: Scan + remediate (dependencies + GitHub Actions pins)
        env:
          GITHUB_TOKEN: ${{ secrets.NOX_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_MAJOR: ${{ inputs.include-major }}
        run: |
          # Scan output goes to RUNNER_TEMP, never the working tree: `-output .`
          # writes findings.json / ai.inventory.json into the repo root, and the
          # commit below stages tracked modifications, so once such a file has
          # been committed once it is re-committed by every later run. That is
          # live today — findings.json rides along in the nomi and dispatch
          # remediation PRs, ai.inventory.json in senat-os, all auto-merged.
          out="${RUNNER_TEMP}/nox-scan"
          mkdir -p "$out"
          nox scan . -format json -output "$out" || true
          # --actions bumps outdated action pins AND SHA-pins mutable tag refs;
          # the deps pass upgrades any OSV-vulnerable go/npm/pypi/cargo package
          # with a fixed_in version. Default nox fix behaviour is unchanged.
          major=""
          [ "$INCLUDE_MAJOR" = "true" ] && major="--include-major"
          nox fix --actions $major --input "$out/findings.json" --root . || true

          # Refresh JS lockfiles for any package.json nox just changed.
          #
          # `nox fix` upgrades npm packages by editing package.json. It does not
          # touch the lockfile, and CI installs with --frozen-lockfile, so the
          # remediation PR failed its own CI on every JS repo in the fleet:
          #
          #   ERR_PNPM_OUTDATED_LOCKFILE  Cannot install with "frozen-lockfile"
          #   because pnpm-lock.yaml is not up to date with package.json
          #
          # `go mod tidy` below has always covered the Go side; the npm side had
          # nothing, so a security fix arrived permanently unmergeable. This runs
          # BEFORE the remediated/tidied split on purpose: refreshing a lockfile
          # to match a package.json nox edited IS part of that remediation, not
          # incidental tidying.
          #
          # Lockfile-only where each manager supports it — no node_modules, no
          # network beyond metadata. Best-effort: a manager that is not
          # installed leaves the repo as it was rather than failing the run.
          for manifest in $(git diff --name-only HEAD -- '**package.json' 'package.json'); do
            dir="$(dirname "$manifest")"
            if [ -f "$dir/pnpm-lock.yaml" ]; then
              (cd "$dir" && corepack enable >/dev/null 2>&1; pnpm install --lockfile-only --ignore-scripts) || true
            elif [ -f "$dir/package-lock.json" ]; then
              (cd "$dir" && npm install --package-lock-only --ignore-scripts) || true
            elif [ -f "$dir/yarn.lock" ]; then
              (cd "$dir" && corepack enable >/dev/null 2>&1; yarn install --mode update-lockfile) || true
            fi
          done

          # Record whether `nox fix` itself changed anything, BEFORE the tidy
          # pass runs. `go mod tidy` is not remediation — it moves requirements
          # between the direct and indirect blocks and fills in missing go.sum
          # lines — but the PR step below could not tell the two apart, so a
          # tidy-only diff was committed as "chore(security): nox remediation"
          # with a body claiming OSV upgrades and action-pin bumps. That is
          # live: klarlabs-studio/warden#202 was exactly this, and it is worse
          # than no PR, because it is a security claim nobody can check without
          # reading the diff.
          empty="$(printf '' | sha256sum | cut -d' ' -f1)"
          after_fix="$(git diff HEAD | sha256sum | cut -d' ' -f1)"
          [ "$after_fix" != "$empty" ] && echo "remediated=true" >> "$GITHUB_ENV" || echo "remediated=false" >> "$GITHUB_ENV"

          [ -f go.mod ] && go mod tidy || true

          after_tidy="$(git diff HEAD | sha256sum | cut -d' ' -f1)"
          [ "$after_tidy" != "$after_fix" ] && echo "tidied=true" >> "$GITHUB_ENV" || echo "tidied=false" >> "$GITHUB_ENV"

      - name: Open remediation PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.NOX_TOKEN || github.token }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "nox: nothing to remediate."
            exit 0
          fi

          # Say what actually happened. `remediated` and `tidied` are set by the
          # step above from the diff before and after `go mod tidy`, so a
          # tidy-only run no longer wears a security title it did not earn.
          tidy_note=""
          [ "$tidied" = "true" ] && tidy_note=" \`go mod tidy\` also ran and adjusted go.mod/go.sum."
          if [ "$remediated" = "true" ]; then
            title="chore(security): nox remediation (deps + actions)"
            label="dependencies"
            body="Automated remediation by \`nox fix --actions\`: OSV-vulnerable dependency upgrades plus outdated and mutable GitHub Actions pins bumped to their SHA-pinned latest release. Replaces dependabot.${tidy_note}"
          else
            title="chore(deps): go mod tidy"
            label="dependencies"
            body="$(printf '%s\n\n%s' \
              '`nox fix` found nothing to remediate — **no vulnerability is being fixed here, and no action pin changed.** What the diff contains is `go mod tidy`: requirements moving between the direct and indirect blocks, and missing go.sum lines filled in. The branch was simply not tidy.' \
              'The honest title is deliberate. This run would previously have been titled `chore(security): nox remediation` with a body claiming OSV upgrades, because the workflow could not tell its own remediation apart from the tidy pass that follows it.')"
          fi

          branch="nox/remediate-${{ github.run_id }}"
          git config user.name "nox-remediate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push -u origin "$branch"
          # Ensure the label exists; `gh pr create --label` hard-fails (exit 1,
          # no PR) in any caller repo that doesn't already have it. --force is
          # idempotent: creates if missing, updates otherwise, never errors.
          gh label create dependencies \
            --color 0366d6 \
            --description "Pull requests that update a dependency file" \
            --force >/dev/null 2>&1 || true
          url="$(gh pr create \
            --title "$title" \
            --body "$body" \
            --label "$label")"
          # Auto-merge once CI is green (same flow dependabot PRs used).
          #
          # This used to be `gh pr merge --auto --squash "$url" || true`, and the
          # `|| true` hid a fleet-wide failure for weeks: on 2026-08-02, 35 of 39
          # open remediation PRs across both orgs had auto-merge NOT enabled and
          # had simply been sitting there. Security remediation was accumulating
          # unmerged with nothing reporting a problem.
          #
          # `--auto` fails for two distinct reasons, and both were silent:
          #
          #   1. The repository has "Allow auto-merge" turned off. 19 of the
          #      klarlabs-studio repos were in this state despite having required
          #      checks, so auto-merge would have worked had the switch been on.
          #   2. The repository has NO branch protection, so there is nothing for
          #      auto-merge to wait on and GitHub rejects the request outright.
          #      All 15 Nox-HQ plugin repos were in this state.
          #
          # Case 2 is not an error to route around: with no required checks there
          # is nothing to wait for, so merging directly is the correct behaviour
          # rather than a workaround. Case 1 is a genuine misconfiguration, and it
          # now produces a warning annotation instead of nothing at all.
          if gh pr merge --auto --squash "$url" 2>/tmp/automerge.err; then
            echo "nox: auto-merge enabled; will land once CI is green."
          elif ! gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge' | grep -q true; then
            echo "::warning::Auto-merge is disabled for this repository, so the remediation PR cannot land on its own. Enable it in Settings -> General -> Pull Requests -> Allow auto-merge. PR: ${url}"
          else
            # Auto-merge is permitted but was refused — with no required status
            # checks there is nothing to gate on. Merge directly rather than
            # leaving a security fix open indefinitely.
            echo "nox: no required checks to wait on; merging directly."
            gh pr merge --squash --delete-branch "$url" \
              || echo "::warning::Could not merge the remediation PR automatically: $(cat /tmp/automerge.err). It needs a manual merge: ${url}"
          fi
