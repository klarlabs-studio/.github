# Thin caller for the shared klarlabs-studio nox remediation.
# Drop this in as .github/workflows/nox-remediate.yml. All logic lives in the
# reusable workflow — bump the pinned nox version there, once, org-wide.
name: Nox Remediate

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {} # nox:ignore IAC-155,IAC-308 -- workflow_dispatch lets a maintainer run remediation on demand; it only opens a PR and merges nothing

permissions:
  contents: write # nox:ignore IAC-314 -- remediation pushes a branch and opens a PR, which needs contents: write; it never merges
  pull-requests: write

jobs:
  remediate:
    uses: klarlabs-studio/.github/.github/workflows/nox-remediate.yml@main
    secrets: inherit
    # with:
    #   include-major: true   # also apply major-version action bumps
